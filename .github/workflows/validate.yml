name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  write-linkedin-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        working-directory: skills/write-linkedin-post/scripts
        run: python -m unittest test_validator.py

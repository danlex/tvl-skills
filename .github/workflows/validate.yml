name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tvl-write-linkedin-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        working-directory: skills/tvl-write-linkedin-post/scripts
        run: python -m unittest test_validator.py
      - name: Run diagram template tests
        run: python skills/tvl-design-diagram/scripts/test_templates.py
      - name: Run Ethical AI detector tests
        run: python skills/tvl-ethical-ai-audit/scripts/test_audit.py
      - name: Run confirmation bias audit tests
        run: python skills/tvl-confirmation-bias-audit/scripts/test_confirmation_bias_audit.py
      - name: Run SEO GEO audit tests
        run: python skills/tvl-seo-geo-audit/scripts/test_seo_geo_audit.py
      - name: Check SEO GEO source freshness
        run: python skills/tvl-seo-geo-audit/scripts/check_reference_freshness.py
      - name: Run free website skill tests
        run: python skills/tvl-build-free-website/scripts/test_free_website_skill.py

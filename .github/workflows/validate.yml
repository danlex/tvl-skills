name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tvl-write-linkedin-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        working-directory: skills/tvl-write-linkedin-post/scripts
        run: python -m unittest test_validator.py
      - name: Run diagram template tests
        run: python skills/tvl-design-diagram/scripts/test_templates.py
      - name: Run Ethical AI detector tests
        run: python skills/tvl-ethical-ai-judge/scripts/test_judge.py
